[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gradys_embedded*"]

[project]
name = "gradys_embedded"
version = "0.1.0"
description = "Runs GrADyS-Sim nextgen protocols in real quadcopter"
keywords = ["mavlink", "http", "real", "gradys", "LAC", "PUC", "drone", "ardupilot", "GrADyS", "reactive"]
authors = [
    { name = "Francisco Meirelles Fleury", email = "franmeifleury@gmail.com" }
]
license = { file = "LICENSE.txt" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# 3.10, not 3.9: runner/configuration.py uses PEP 604 unions (`str | None`) in a
# dataclass without `from __future__ import annotations`, and dataclasses
# evaluates those annotations at runtime. On 3.9 the module raises TypeError on
# import. Raspberry Pi OS Bookworm ships 3.11; Bullseye ships 3.9.
requires-python = ">=3.10"

dependencies = [
    'fastapi>=0.115.4',
    'uvicorn>=0.32.0',
    'aiohttp>=3.9.0',
    'pydantic>=2.12.5',
    # FastAPI needs it for the multipart form on POST /protocols/upload; without
    # it the control app fails to build at import time in a clean environment.
    'python-multipart>=0.0.9',
    'cryptography>=41.0.0',
    # Imported by protocol/plugin/statistics.py, which every experiment
    # protocol pulls in via create_statistics.
    'pandas>=2.0.0'
]

[project.scripts]
gradys-embedded = "gradys_embedded.runner.cli:main"

[project.optional-dependencies]
http3 = [
    'hypercorn[h3]>=0.17.0',
    'niquests>=3.12.2'
]
zenoh = [
    'eclipse-zenoh>=1.0.0'
]
test = [
    'pytest>=8.0.0'
]

[project.urls]
"Homepage" = "https://github.com/Project-GrADyS/gradys-embedded"

[tool.pytest.ini_options]
# The repo root on sys.path is what makes `from tests.conftest import ...`
# resolve under plain `pytest` (no tests/__init__.py; rootdir-relative).
pythonpath = ["."]
testpaths = ["tests"]